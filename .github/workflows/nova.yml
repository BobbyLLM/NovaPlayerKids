# check what is installed in ubuntu-latest https://github.com/actions/virtual-environments
name: NOVA CI
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [ nova ]
  pull_request:
    branches: [ nova ]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME:   ${ANDROID_NDK_LATEST_HOME}
      ANDROID_NDK_ROOT:   ${ANDROID_NDK_LATEST_HOME}
    steps:
    - uses: actions/checkout@v4
    - name: setup java17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: install packages
      run: |
        sudo apt-get update || sudo apt-get update
        sudo apt-get install -y nasm meson ninja-build maven build-essential wget curl unzip git pkg-config
    - name: install repo
      run: |
        curl https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
        sudo chmod a+x /usr/local/bin/repo
    - name: retrieve pinned Nova Player Kids source
      run: |
         mkdir nova
         cd nova
         repo init -u https://github.com/BobbyLLM/NovaPlayerKids -b nova -m kids-v6_4_64.xml
         # v6.4.64 pins two prebuilt projects to orphaned but still fetchable
         # release commits; repo cannot update tracking refs for unreachable
         # branch objects, so fetch those immutable release objects explicitly.
         repair_release_project() {
           path="$1"
           url="$2"
           sha="$3"
           mkdir -p "$path"
           if [ ! -d "$path/.git" ]; then
             git -C "$path" init
             git -C "$path" remote add origin "$url"
           fi
           git -C "$path" fetch origin "$sha"
           git -C "$path" checkout --detach "$sha"
         }
         set +e
         repo sync -j 4
         sync_status=$?
         set -e
         if [ "$sync_status" -ne 0 ]; then
           repair_release_project native/prebuilt/opus https://github.com/nova-video-player/prebuilt-opus.git 27544063be93ee55c6ba58a2ebb32c106eb2e37b
           repair_release_project native/prebuilt/ffmpeg https://github.com/nova-video-player/prebuilt-ffmpeg.git 6ba0e9340cf725bede2e2f29d30c290a2ab8130e
         fi
         repo forall -c 'actual=$(git rev-parse HEAD); printf "%s %s\n" "$REPO_PATH" "$actual"; test "$actual" = "$REPO_RREV"'
    - name: configure Nova Player Kids signing
      env:
        NPK_KEYSTORE_B64: ${{ secrets.NPK_KEYSTORE_B64 }}
        NPK_KEYSTORE_PASSWORD: ${{ secrets.NPK_KEYSTORE_PASSWORD }}
        NPK_KEY_ALIAS: ${{ secrets.NPK_KEY_ALIAS }}
        NPK_KEY_PASSWORD: ${{ secrets.NPK_KEY_PASSWORD }}
      run: |
        set +x
        mkdir -p "$RUNNER_TEMP/novaplayerkids"
        printf '%s' "$NPK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/novaplayerkids/NovaPlayerKids-release.jks"
        cat > nova/Video/keystore.properties <<EOF
storeFile=$RUNNER_TEMP/novaplayerkids/NovaPlayerKids-release.jks
storeType=PKCS12
storePassword=$NPK_KEYSTORE_PASSWORD
keyAlias=$NPK_KEY_ALIAS
keyPassword=$NPK_KEY_PASSWORD
EOF
    - name: build signed universal APK
      run: |
        cd nova/Video
        ./gradlew aNR -Puniversal
        ./gradlew lint -Puniversal
        universal=$(find build/outputs/apk -type f -iname '*universal*release*.apk' | head -n 1)
        test -n "$universal"
        mkdir -p "$GITHUB_WORKSPACE/artifacts"
        cp "$universal" "$GITHUB_WORKSPACE/artifacts/NovaPlayerKids-v6.4.64-universal-release.apk"
        sha256sum "$GITHUB_WORKSPACE/artifacts/NovaPlayerKids-v6.4.64-universal-release.apk"
    - name: verify signed APK identity
      run: |
        apk="$GITHUB_WORKSPACE/artifacts/NovaPlayerKids-v6.4.64-universal-release.apk"
        build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
        "$build_tools/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/novaplayerkids/badging.txt"
        grep -F "package: name='com.bobbyllm.novaplayerkids'" "$RUNNER_TEMP/novaplayerkids/badging.txt"
        grep -F "application-label:'Nova Player Kids'" "$RUNNER_TEMP/novaplayerkids/badging.txt"
        "$build_tools/apksigner" verify --verbose "$apk"
    - name: upload signed universal APK
      uses: actions/upload-artifact@v4
      with:
        name: NovaPlayerKids-v6.4.64-universal-release
        path: artifacts/NovaPlayerKids-v6.4.64-universal-release.apk
        if-no-files-found: error
