# check what is installed in ubuntu-latest https://github.com/actions/virtual-environments
name: NOVA CI
on:
  workflow_dispatch:
  push:
    branches: [ nova ]
  pull_request:
    branches: [ nova ]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME:   ${ANDROID_NDK_LATEST_HOME}
      ANDROID_NDK_ROOT:   ${ANDROID_NDK_LATEST_HOME}
    steps:
    - uses: actions/checkout@v4
    - name: setup java17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: install packages
      run: |
        sudo apt-get update || sudo apt-get update
        sudo apt-get install -y nasm meson ninja-build maven build-essential wget curl unzip git pkg-config
    - name: install repo
      run: |
        curl https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
        sudo chmod a+x /usr/local/bin/repo
    - name: retrieve pinned Nova Player Kids source
      run: |
         mkdir nova
         cd nova
         repo init -u https://github.com/BobbyLLM/NovaPlayerKids -b nova -m kids-v6_4_64.xml
         # v6.4.64 pins prebuilt-opus to an orphaned but still fetchable release
         # commit; repo cannot update its tracking ref for an unreachable branch
         # object, so fetch that immutable release object explicitly after sync.
         set +e
         repo sync -j 4
         sync_status=$?
         set -e
         if [ "$sync_status" -ne 0 ]; then
           git -C native/prebuilt/opus fetch origin 27544063be93ee55c6ba58a2ebb32c106eb2e37b
           git -C native/prebuilt/opus checkout --detach 27544063be93ee55c6ba58a2ebb32c106eb2e37b
         fi
         repo forall -c 'actual=$(git rev-parse HEAD); printf "%s %s\n" "$REPO_PATH" "$actual"; test "$actual" = "$REPO_RREV"'
    - name: build
      run: |
        cd nova/Video
        ./gradlew aNR
